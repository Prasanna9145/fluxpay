spring.application.name=fluxpay

# PostgreSQL. Override every credential using environment variables outside local development.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fluxpay}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# Flyway owns schema changes. baseline-on-migrate supports an existing local database
# whose legacy tables were created before migrations were added.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

# Kafka; localhost for app run directly, kafka:29092 for Docker Compose.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:fluxpay-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.prasanna.fluxpay.event
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.prasanna.fluxpay.event.PaymentCreatedEvent

# Optional Redis integration. API continues with local rate-limit fallback if Redis is unavailable.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=750ms

# Local-only signing key. ALWAYS override APP_JWT_SECRET with a unique, strong value outside demos.
app.jwt.secret=${APP_JWT_SECRET:dev-only-change-this-secret-to-a-strong-32-byte-key}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
app.rate-limit.auth-per-minute=${RATE_LIMIT_AUTH_PER_MINUTE:10}
app.rate-limit.payment-per-minute=${RATE_LIMIT_PAYMENT_PER_MINUTE:30}
app.outbox.poll-interval-ms=${OUTBOX_POLL_INTERVAL_MS:3000}
app.webhooks.poll-interval-ms=${WEBHOOK_POLL_INTERVAL_MS:15000}
app.webhooks.max-attempts=${WEBHOOK_MAX_ATTEMPTS:6}
app.webhooks.retry-base-seconds=${WEBHOOK_RETRY_BASE_SECONDS:5}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.health.redis.enabled=false
info.app.name=FluxPay
info.app.description=Local demo payment processing platform
info.app.version=0.1.0

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
